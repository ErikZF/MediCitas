apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: medicitas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: medicitas
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: medicitas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: medicitas
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-realm
          image: medicitas/assets:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /assets/keycloak/realm-export.json /import/realm-export.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm-import
              mountPath: /import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: KEYCLOAK_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_HTTP_MANAGEMENT_PORT
            - name: REALM_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: REALM_NAME
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: CLIENT_ID
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: BASE_URL
            - name: KEYCLOAK_TEST_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_TEST_CLIENT_ID
            - name: KEYCLOAK_TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: KEYCLOAK_TEST_PASSWORD
            - name: KEYCLOAK_USER_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: KEYCLOAK_USER_ADMIN_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: keycloak-h2
              mountPath: /opt/keycloak/data/h2
              subPath: h2
      volumes:
        - name: realm-import
          emptyDir: {}
        - name: keycloak-h2
          persistentVolumeClaim:
            claimName: keycloak-data
