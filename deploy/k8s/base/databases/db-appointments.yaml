apiVersion: v1
kind: Service
metadata:
  name: db-appointments
  labels:
    app.kubernetes.io/name: db-appointments
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: medicitas
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: db-appointments
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-appointments
  labels:
    app.kubernetes.io/name: db-appointments
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: medicitas
spec:
  serviceName: db-appointments
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-appointments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-appointments
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: medicitas
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-init-sql
          image: medicitas/assets:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /assets/database/appointments/*.sql /init-sql/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: init-sql
              mountPath: /init-sql
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_APPOINTMENTS_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_APPOINTMENTS_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_APPOINTMENTS_NAME
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-sql
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: db-appointments
          app.kubernetes.io/part-of: medicitas
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
