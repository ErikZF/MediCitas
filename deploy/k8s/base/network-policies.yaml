# Zero-trust ingress isolation mirroring the public_net / private_net split
# from docker-compose.yml: deny all pod ingress by default, then allow only
# explicit microservice, gateway, cache, database, and identity flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: medicitas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-gateway
  labels:
    app.kubernetes.io/part-of: medicitas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak
  labels:
    app.kubernetes.io/part-of: medicitas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clinics-service
  labels:
    app.kubernetes.io/part-of: medicitas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clinics-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: users-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: appointments-service
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
