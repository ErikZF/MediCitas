apiVersion: v1
kind: Service
metadata:
  name: audit-service
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: medicitas
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: audit-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: medicitas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: medicitas
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: audit-service
      initContainers:
        - name: wait-for-deps
          image: medicitas/assets:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const net = require('node:net');
              const waitTcp = (host, port) => new Promise((res) => {
                const s = net.connect({ host, port });
                s.once('connect', () => { s.destroy(); res(true); });
                s.once('error', () => { s.destroy(); res(false); });
              });
              const waitHttp = async (url) => { try { return (await fetch(url)).ok; } catch { return false; } };
              (async () => {
                const kc = `${process.env.KEYCLOAK_INTERNAL_URL}/realms/${encodeURIComponent(process.env.REALM_NAME)}/.well-known/openid-configuration`;
                const port = Number(process.env.DB_CONNECT_PORT);
                for (;;) {
                  const ok = await waitTcp(process.env.DB_LOGS_HOST, port)
                    && await waitTcp(process.env.DB_APPOINTMENTS_HOST, port)
                    && await waitTcp(process.env.DB_USERS_HOST, port)
                    && await waitHttp(kc);
                  if (ok) break;
                  await new Promise((r) => setTimeout(r, 2000));
                }
              })();
          envFrom:
            - configMapRef:
                name: medicitas-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: audit-service
          image: medicitas/audit-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: API_INTERNAL_PORT
            - name: DB_CONNECT_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_CONNECT_PORT
            - name: DB_LOGS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_LOGS_HOST
            - name: DB_LOGS_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_LOGS_NAME
            - name: DB_LOGS_USER
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_LOGS_USER
            - name: DB_LOGS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_LOGS_PASSWORD
            - name: DB_APPOINTMENTS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_APPOINTMENTS_HOST
            - name: DB_APPOINTMENTS_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_APPOINTMENTS_NAME
            - name: DB_APPOINTMENTS_USER
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_APPOINTMENTS_USER
            - name: DB_APPOINTMENTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_APPOINTMENTS_PASSWORD
            - name: DB_USERS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_USERS_HOST
            - name: DB_USERS_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: DB_USERS_NAME
            - name: DB_USERS_USER
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_USERS_USER
            - name: DB_USERS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: DB_USERS_PASSWORD
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_INTERNAL_URL
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_ISSUER
            - name: KEYCLOAK_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_AUDIENCE
            - name: REALM_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: REALM_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-service-pdb
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: medicitas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-service-hpa
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: medicitas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
