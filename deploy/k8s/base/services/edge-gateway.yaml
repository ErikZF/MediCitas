apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: medicitas
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: edge-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: medicitas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: medicitas
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge-gateway
      initContainers:
        - name: wait-for-upstreams
          image: medicitas/assets:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const waitHttp = async (url) => { try { return (await fetch(url)).ok; } catch { return false; } };
              (async () => {
                const urls = [
                  `${process.env.CLINICS_SERVICE_URL}/health`,
                  `${process.env.USERS_SERVICE_URL}/health`,
                  `${process.env.APPOINTMENTS_SERVICE_URL}/health`,
                  `${process.env.AUDIT_SERVICE_URL}/health`,
                ];
                for (;;) {
                  const results = await Promise.all(urls.map(waitHttp));
                  if (results.every(Boolean)) break;
                  await new Promise((r) => setTimeout(r, 2000));
                }
              })();
          envFrom:
            - configMapRef:
                name: medicitas-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: edge-gateway
          image: medicitas/edge-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: API_INTERNAL_PORT
            - name: CLINICS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: CLINICS_SERVICE_URL
            - name: USERS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: USERS_SERVICE_URL
            - name: APPOINTMENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: APPOINTMENTS_SERVICE_URL
            - name: AUDIT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: AUDIT_SERVICE_URL
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_INTERNAL_URL
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_ISSUER
            - name: KEYCLOAK_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: KEYCLOAK_AUDIENCE
            - name: REALM_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: REALM_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-gateway-pdb
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: medicitas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-gateway-hpa
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: medicitas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
