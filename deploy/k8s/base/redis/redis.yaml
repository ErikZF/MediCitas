apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: medicitas
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: medicitas
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: medicitas
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:alpine3.23
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --port "$REDIS_PORT" --requirepass "$REDIS_PASSWORD" --appendonly yes --dir /data
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicitas-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: medicitas-secrets
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p \"$REDIS_PORT\" ping | grep -q PONG"]
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p \"$REDIS_PORT\" ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p \"$REDIS_PORT\" ping | grep -q PONG"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redisdata
              mountPath: /data
              subPath: data
  volumeClaimTemplates:
    - metadata:
        name: redisdata
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/part-of: medicitas
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
