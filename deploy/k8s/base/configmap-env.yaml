apiVersion: v1
kind: ConfigMap
metadata:
  name: medicitas-config
  labels:
    app.kubernetes.io/part-of: medicitas
data:
  API_INTERNAL_PORT: "3000"
  DB_CONNECT_PORT: "5432"

  # PostgreSQL hosts and database names
  DB_CLINICS_HOST: "db-clinics"
  DB_CLINICS_NAME: "clinics_db"
  DB_USERS_HOST: "db-users"
  DB_USERS_NAME: "users_db"
  DB_APPOINTMENTS_HOST: "db-appointments"
  DB_APPOINTMENTS_NAME: "appointments_db"
  DB_LOGS_HOST: "db-logs"
  DB_LOGS_NAME: "logs_db"

  # Internal microservice URLs (ClusterIP DNS)
  CLINICS_SERVICE_URL: "http://clinics-service:3000"
  USERS_SERVICE_URL: "http://users-service:3000"
  APPOINTMENTS_SERVICE_URL: "http://appointments-service:3000"
  AUDIT_SERVICE_URL: "http://audit-service:3000"

  # Redis availability cache
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_ENABLED: "true"
  CACHE_TTL_SECONDS: "600"

  # Keycloak OIDC configuration
  KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
  KEYCLOAK_ISSUER: "http://localhost:8080/realms/Sistema_Clinico"
  KEYCLOAK_AUDIENCE: "Medi_Citas"
  KEYCLOAK_HTTP_MANAGEMENT_PORT: "9000"
  REALM_NAME: "Sistema_Clinico"
  CLIENT_ID: "Medi_Citas"
  BASE_URL: "http://localhost:3000"
  KEYCLOAK_TEST_CLIENT_ID: "integration-tests"
