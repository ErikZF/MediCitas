# Expose edge-gateway (3000) and keycloak (8080) on localhost via Kind extraPortMappings.
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880
