name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Check the demo seed matches its data
        run: npm run seed:check

  unit-tests:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

  integration-tests:
    name: Database Integration & Concurrency Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Availability cache tests (card E8, invariant I8) need a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Load the demo seed into PostgreSQL 18
        env:
          PGHOST: localhost
          PGUSER: test
          PGPASSWORD: test_password
          PGOPTIONS: -c client_min_messages=warning
        run: |
          for db in clinics users appointments logs; do
            psql -d postgres -v ON_ERROR_STOP=1 -qc "CREATE DATABASE seed_${db}"
            psql -d "seed_${db}" -v ON_ERROR_STOP=1 -q -f "database/${db}/init.sql"
            psql -d "seed_${db}" -v ON_ERROR_STOP=1 -q -f "database/${db}/seed.sql"
          done

      - name: Run every workspace suite with PostgreSQL and Redis
        env:
          TEST_DATABASE_URL: postgres://test:test_password@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
        # The same command as `npm run test:all`, with the service containers above
        # instead of docker-compose.test.yml, and without the end-to-end stage.
        run: npm run test:all -- --external --no-e2e

  e2e-compose:
    name: End-to-end against Docker Compose
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # What the evaluator does on a fresh clone: copy the example configuration,
      # bring the stack up with one command and run the documented test command.
      - name: Use the example configuration
        run: cp .env.example .env

      - name: Start the stack and run the end-to-end suite
        run: npm run test:e2e

      - name: Show the stack when it fails
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80

  docker-build:
    name: Docker Build Validation (${{ matrix.service }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - edge-gateway
          - clinics-service
          - users-service
          - appointments-service
          - audit-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: medicitas/${{ matrix.service }}:test
