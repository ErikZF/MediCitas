x-service-healthcheck: &service-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.API_INTERNAL_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  db_clinics:
    image: postgres:17-alpine
    container_name: postgre_clinics_MediCitas
    environment:
      POSTGRES_USER: ${DB_CLINICS_USER}
      POSTGRES_PASSWORD: ${DB_CLINICS_PASSWORD}
      POSTGRES_DB: ${DB_CLINICS_NAME}
    volumes:
      - pgdata_clinics:/var/lib/postgresql/data
      - ./database/clinics:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_CLINICS_PORT}:${POSTGRE_INTERNAL_PORT}"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_CLINICS_USER} -d ${DB_CLINICS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_users:
    image: postgres:17-alpine
    container_name: postgre_users_MediCitas
    environment:
      POSTGRES_USER: ${DB_USERS_USER}
      POSTGRES_PASSWORD: ${DB_USERS_PASSWORD}
      POSTGRES_DB: ${DB_USERS_NAME}
    volumes:
      - pgdata_users:/var/lib/postgresql/data
      - ./database/users:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_USERS_PORT}:${POSTGRE_INTERNAL_PORT}"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERS_USER} -d ${DB_USERS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_appointments:
    image: postgres:17-alpine
    container_name: postgre_appointments_MediCitas
    environment:
      POSTGRES_USER: ${DB_APPOINTMENTS_USER}
      POSTGRES_PASSWORD: ${DB_APPOINTMENTS_PASSWORD}
      POSTGRES_DB: ${DB_APPOINTMENTS_NAME}
    volumes:
      - pgdata_appointments:/var/lib/postgresql/data
      - ./database/appointments:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_APPOINTMENTS_PORT}:${POSTGRE_INTERNAL_PORT}"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_APPOINTMENTS_USER} -d ${DB_APPOINTMENTS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_logs:
    image: postgres:17-alpine
    container_name: postgre_logs_MediCitas
    environment:
      POSTGRES_USER: ${DB_LOGS_USER}
      POSTGRES_PASSWORD: ${DB_LOGS_PASSWORD}
      POSTGRES_DB: ${DB_LOGS_NAME}
    volumes:
      - pgdata_logs:/var/lib/postgresql/data
      - ./database/logs:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_LOGS_PORT}:${POSTGRE_INTERNAL_PORT}"
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_LOGS_USER} -d ${DB_LOGS_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak_MediCitas
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: ${KEYCLOAK_MANAGEMENT_PORT}
      REALM_NAME: ${REALM_NAME}
      CLIENT_ID: ${CLIENT_ID}
      BASE_URL: ${BASE_URI}:${API_PORT}

      # Integration tests
      KEYCLOAK_TEST_CLIENT_ID: ${KEYCLOAK_TEST_CLIENT_ID}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_INTERNAL_PORT}"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/$${KC_HTTP_MANAGEMENT_PORT} && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 40s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - public_net
      - private_net

  redis:
    image: redis:alpine3.23
    container_name: Redis_MediCitas
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    environment:
      REDIS_PORT: ${REDIS_PORT}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD} --appendonly yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - private_net
    restart: unless-stopped

  clinics-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: clinics-service
    container_name: clinics_service_MediCitas
    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      DB_CONNECT_PORT: ${DB_CONNECT_PORT}
      DB_CLINICS_HOST: ${DB_CLINICS_HOST}
      DB_CLINICS_NAME: ${DB_CLINICS_NAME}
      DB_CLINICS_USER: ${DB_CLINICS_USER}
      DB_CLINICS_PASSWORD: ${DB_CLINICS_PASSWORD}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      REALM_NAME: ${REALM_NAME}
    depends_on:
      db_clinics:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - private_net
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: users-service
    container_name: users_service_MediCitas
    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      DB_CONNECT_PORT: ${DB_CONNECT_PORT}
      DB_USERS_HOST: ${DB_USERS_HOST}
      DB_USERS_NAME: ${DB_USERS_NAME}
      DB_USERS_USER: ${DB_USERS_USER}
      DB_USERS_PASSWORD: ${DB_USERS_PASSWORD}
      CLINICS_SERVICE_URL: ${CLINICS_SERVICE_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      REALM_NAME: ${REALM_NAME}
    depends_on:
      db_users:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clinics-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - private_net
    restart: unless-stopped

  appointments-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: appointments-service
    container_name: appointments_service_MediCitas
    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      DB_CONNECT_PORT: ${DB_CONNECT_PORT}
      DB_APPOINTMENTS_HOST: ${DB_APPOINTMENTS_HOST}
      DB_APPOINTMENTS_NAME: ${DB_APPOINTMENTS_NAME}
      DB_APPOINTMENTS_USER: ${DB_APPOINTMENTS_USER}
      DB_APPOINTMENTS_PASSWORD: ${DB_APPOINTMENTS_PASSWORD}
      CLINICS_SERVICE_URL: ${CLINICS_SERVICE_URL}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      REDIS_URL: ${REDIS_URL}
      CACHE_ENABLED: ${CACHE_ENABLED}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      REALM_NAME: ${REALM_NAME}
    depends_on:
      db_appointments:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clinics-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - private_net
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: audit-service
    container_name: audit_service_MediCitas
    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      DB_CONNECT_PORT: ${DB_CONNECT_PORT}
      DB_LOGS_HOST: ${DB_LOGS_HOST}
      DB_LOGS_NAME: ${DB_LOGS_NAME}
      DB_LOGS_USER: ${DB_LOGS_USER}
      DB_LOGS_PASSWORD: ${DB_LOGS_PASSWORD}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      REALM_NAME: ${REALM_NAME}
    depends_on:
      db_logs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - private_net
    restart: unless-stopped

  edge-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: edge-gateway
    container_name: edge_gateway_MediCitas
    environment:
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      CLINICS_SERVICE_URL: ${CLINICS_SERVICE_URL}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      APPOINTMENTS_SERVICE_URL: ${APPOINTMENTS_SERVICE_URL}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      REALM_NAME: ${REALM_NAME}
    ports:
      - "${API_PORT}:${API_INTERNAL_PORT}"
    depends_on:
      clinics-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      appointments-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - public_net
      - private_net
    restart: unless-stopped

volumes:
  pgdata_clinics:
  pgdata_users:
  pgdata_appointments:
  pgdata_logs:
  redisdata:

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true
